<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>ConstructionScheduleGame</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #182330;
      }

      #unity-container {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      /* 16:9を維持しながら、ブラウザの表示領域内で最大化する。 */
      #unity-canvas {
        display: block;
        width: min(100vw, 177.7778vh);
        height: min(100vh, 56.25vw);
        background: #231F20;
        outline: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        font: 600 18px sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    </div>
    <div id="loading">ゲームを読み込んでいます…</div>

    <script src="Build/ConstructionGame_WebGL.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");

      createUnityInstance(canvas, {
        dataUrl: "Build/ConstructionGame_WebGL.data.unityweb",
        frameworkUrl: "Build/ConstructionGame_WebGL.framework.js.unityweb",
        codeUrl: "Build/ConstructionGame_WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ConstructionScheduleGame",
        productVersion: "1.0",
        devicePixelRatio: 1
      }).then(() => {
        loading.style.display = "none";
        canvas.focus();
      }).catch((message) => {
        loading.textContent = "読み込みに失敗しました: " + message;
      });
    </script>
  </body>
</html>
